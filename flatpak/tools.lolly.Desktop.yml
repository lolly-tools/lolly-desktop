# Flatpak manifest for the Lolly desktop app (Tauri v2).
#
# STRATEGY: this manifest does NOT build Lolly from source. flatpak-builder runs
# offline (no network in the build sandbox), and vendoring every cargo crate + npm
# package as Flatpak sources is fragile and huge. Instead, CI builds a Debian package
# with `tauri build --bundles deb` (which has network + the webkit2gtk toolchain), and
# this manifest just unpacks that prebuilt binary into /app. See ./README.md and
# ../../../.github/workflows/flatpak.yml.
#
# The .deb must be staged next to this file as `lolly.deb` before building - CI does
# that from the build-deb job's artifact; locally, copy it there yourself.
#
# app-id == the Tauri `identifier` in ../src-tauri/tauri.conf.json, so the Flatpak,
# the .desktop file, the GTK app-id and the AppStream component all agree.
id: tools.lolly.Desktop

# Tauri v2 renders through webkit2gtk-4.1 (GTK3), which the GNOME runtime provides.
# Keep runtime-version in lockstep with the flatpak-builder container image tag in the
# CI workflow (gnome-49 -> '49'). Bump both together.
#
# Was '47' until 2026-08-28. That was never buildable by anyone who did not already
# have the runtime cached: GNOME 47 is EOL and Flathub no longer publishes
# org.gnome.Platform//47 at all, so `flatpak-builder` could not resolve it. Flathub
# currently offers 49 and 50; 49 is the more settled of the two.
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

# The in-sandbox executable (Cargo package name `lolly-desktop`; no mainBinaryName
# override in tauri.conf.json, so this is what lands in /usr/bin inside the .deb).
command: lolly-desktop

finish-args:
  # Rendering: Wayland first, X11 fallback, GPU access for the webview compositor.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Network: catalog/asset sync, the tauri-plugin-http net bridge, and the url-shot
  # tool's local headless-Chrome DevTools connection.
  - --share=network
  # Let users save exports to their Downloads/Documents (state lives in the app's
  # per-app dir, which Flatpak grants automatically - no extra permission needed).
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Common Tauri-on-Flatpak fix: the DMABUF renderer shows a blank window on some
  # GPUs/drivers under the sandbox. Drop this once you confirm rendering is fine.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  # The app itself owns the GNOME Shell search-provider bus name and the
  # org.lolly.Desktop1 automation name while running (DBusActivatable stays false -
  # the shell falls back to launching). Without these, the sandbox proxy silently
  # refuses the name grab and both integrations go dark. Flathub review of
  # --own-name is standard (plans/174-linux-desktop-home.md, "out of wave" notes).
  - --own-name=tools.lolly.Desktop.SearchProvider
  - --own-name=org.lolly.Desktop1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  - name: lolly
    buildsystem: simple
    build-commands:
      # 1) Unpack the Tauri-built .deb (ar archive -> data.tar.gz) and install ONLY its
      #    binary, as /app/bin/lolly-desktop to match `command:` above. Installing
      #    whatever single binary ./usr/bin ships keeps this correct even if a Tauri
      #    version names it differently than the Cargo package. (Tauri gzips the data
      #    member, hence -xzf; see README if a future version switches to xz/zst.)
      - ar x lolly.deb
      - tar -xzf data.tar.gz
      - install -Dm755 "$(find usr/bin -maxdepth 1 -type f | head -1)" /app/bin/lolly-desktop
      # 2) Ship a deterministic desktop entry, AppStream metainfo, and icons rather
      #    than fishing them out of the .deb's internal layout (names/paths vary by
      #    Tauri version). flatpak-builder auto-exports the .desktop + metainfo.
      - install -Dm644 tools.lolly.Desktop.desktop /app/share/applications/tools.lolly.Desktop.desktop
      - install -Dm644 tools.lolly.Desktop.metainfo.xml /app/share/metainfo/tools.lolly.Desktop.metainfo.xml
      - install -Dm644 icon-32.png  /app/share/icons/hicolor/32x32/apps/tools.lolly.Desktop.png
      - install -Dm644 icon-64.png  /app/share/icons/hicolor/64x64/apps/tools.lolly.Desktop.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/tools.lolly.Desktop.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/tools.lolly.Desktop.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/tools.lolly.Desktop.png
      # 3) Freedesktop integration, single-sourced from ../linux (see its README).
      #    mime/packages, gnome-shell/search-providers and dbus-1/services are on
      #    Flatpak's export whitelist, so the host sees them; share/thumbnailers is
      #    NOT exported - installed anyway for forward-compatibility, the RPM/deb is
      #    the packaging that thumbnails on the host today. The KDE service menu is
      #    deliberately absent here: Flatpak never exports kio/servicemenus.
      - install -Dm644 tools.lolly.Desktop.xml /app/share/mime/packages/tools.lolly.Desktop.xml
      - install -Dm644 tools.lolly.Desktop.search-provider.ini /app/share/gnome-shell/search-providers/tools.lolly.Desktop.search-provider.ini
      - install -Dm644 tools.lolly.Desktop.SearchProvider.service /app/share/dbus-1/services/tools.lolly.Desktop.SearchProvider.service
      - install -Dm644 org.lolly.Desktop1.service /app/share/dbus-1/services/org.lolly.Desktop1.service
      - install -Dm755 lolly-thumbnail /app/bin/lolly-thumbnail
      - install -Dm644 lolly.thumbnailer /app/share/thumbnailers/lolly.thumbnailer
    sources:
      - type: file
        path: lolly.deb
      - type: file
        path: tools.lolly.Desktop.desktop
      - type: file
        path: tools.lolly.Desktop.metainfo.xml
      - type: file
        path: icon-32.png
      - type: file
        path: icon-64.png
      - type: file
        path: icon-128.png
      - type: file
        path: icon-256.png
      - type: file
        path: icon-512.png
      # The integration files stay in ../linux so the RPM installs the identical
      # bytes (same single-source reasoning as rpm/make-sources.sh copying this
      # directory's .desktop). flatpak-builder resolves file paths relative to the
      # manifest, so ../ is fine and deterministic; each lands in the build dir
      # under its basename, which the install lines above use.
      - type: file
        path: ../linux/mime/tools.lolly.Desktop.xml
      - type: file
        path: ../linux/search/tools.lolly.Desktop.search-provider.ini
      - type: file
        path: ../linux/search/tools.lolly.Desktop.SearchProvider.service
      - type: file
        path: ../linux/search/org.lolly.Desktop1.service
      - type: file
        path: ../linux/thumbnailer/lolly-thumbnail
      - type: file
        path: ../linux/thumbnailer/lolly.thumbnailer
